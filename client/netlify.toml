# Netlify build config for the Freestyle Battle CLIENT.
# Set this project's "Base directory" to `client` in Netlify (or deploy from
# the client/ folder). Then set the env var VITE_SERVER_URL to your deployed
# server URL (Railway/Render/Fly) in Netlify → Site settings → Environment.

[build]
  command = "npm run build"
  publish = "dist"

# Single-page-app fallback: every route serves index.html so deep links work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
